name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto, patch, minor, major)"
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      slack_notify:
        description: "Post release notes to Slack?"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write  # push commit/tag + create release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get default branch
        id: default_branch
        run: |
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r '.default_branch')
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Default branch: $DEFAULT_BRANCH"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.default_branch.outputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Run standard-version with selected bump
      - name: Run standard-version
        run: |
          if [ "${{ inputs.bump }}" = "auto" ]; then
            npx standard-version
          else
            npx standard-version -r "${{ inputs.bump }}"
          fi

      - name: Capture new version
        run: echo "NEW_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Capture package name
        run: echo "PACKAGE_NAME=$(jq -r .name package.json)" >> "$GITHUB_ENV"

      - name: Sync version to composer.json
        run: |
          NEW_VERSION=$(jq -r .version package.json)
          jq --arg version "$NEW_VERSION" '.version = $version' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
          git add composer.json
          git commit --amend --no-edit --no-verify

      - name: Push commit and tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Configure git to use token for authentication
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push --follow-tags origin HEAD:${{ steps.default_branch.outputs.branch }}

      - name: Extract release notes (latest ## section)
        id: notes
        run: |
          NOTES="$(awk 'BEGIN{p=0} /^## /{if(p++) exit} p{print}' CHANGELOG.md)"
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}     # remove "v" if you set tagPrefix:""
          name: v${{ env.NEW_VERSION }}
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ contains(env.NEW_VERSION, '-') }}  # true if you use prerelease tags in future
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack (optional)
        if: ${{ inputs.slack_notify == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ env.NEW_VERSION }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: |
          # Check webhook URL first and fail fast if not set
          if [ -z "$SLACK_WEBHOOK_URL" ] || [ "$SLACK_WEBHOOK_URL" = "" ]; then
            echo "Error: SLACK_WEBHOOK_URL secret is not set"
            exit 1
          fi

          # Grab latest "## ..." section
          NOTES="$(awk 'BEGIN{p=0} /^## /{if(p++) exit} p{print}' CHANGELOG.md | sed '/^## /d')"

          # Build changelog URL
          DEFAULT_BRANCH="${{ steps.default_branch.outputs.branch }}"
          CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/blob/${DEFAULT_BRANCH}/CHANGELOG.md"
          CHANGELOG_LINK_TEXT="<${CHANGELOG_URL}|View Changelog>"

          # Build Block Kit: header + (optional) notes + changelog link
          header=$(jq -n --arg p "$PACKAGE_NAME" --arg v "$VERSION" '{type:"header",text:{type:"plain_text",text:($p + " Release " + $v)}}')
          divider='{"type":"divider"}'
          changelog_link=$(jq -n --arg link "$CHANGELOG_LINK_TEXT" '{type:"section",text:{type:"mrkdwn",text:$link}}')

          if [ -n "$NOTES" ]; then
            notes_block=$(jq -n --arg n "$NOTES" '{type:"section",text:{type:"mrkdwn",text:$n}}')
            payload=$(jq -n --argjson h "$header" --argjson d "$divider" --argjson n "$notes_block" --argjson c "$changelog_link" \
              '{blocks: [$h, $d, $n, $c]}')
          else
            payload=$(jq -n --argjson h "$header" --argjson d "$divider" --argjson c "$changelog_link" \
              '{blocks: [$h, $d, $c]}')
          fi

          curl -sS -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL"


