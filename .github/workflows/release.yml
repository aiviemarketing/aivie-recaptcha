name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto, patch, minor, major)"
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      slack_notify:
        description: "Post release notes to Slack?"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write  # push commit/tag + create release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get default branch
        id: default_branch
        run: |
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | jq -r '.default_branch')
          echo "branch=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Default branch: $DEFAULT_BRANCH"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.default_branch.outputs.branch }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Ensure jq is installed
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Run standard-version with selected bump
      - name: Run standard-version
        run: |
          if [ "${{ inputs.bump }}" = "auto" ]; then
            npx standard-version
          else
            npx standard-version -r "${{ inputs.bump }}"
          fi

      - name: Capture new version
        run: echo "NEW_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Capture package name
        run: echo "PACKAGE_NAME=$(jq -r .name package.json)" >> "$GITHUB_ENV"

      - name: Sync version to composer.json
        run: |
          chmod +x scripts/sync-version-files.js
          scripts/sync-version-files.js
          for file in package.json package-lock.json composer.json Config/config.php; do
            [ -f "$file" ] && git add "$file"
          done
          git commit --amend --no-edit --no-verify

      - name: Push commit and tag
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Configure git to use token for authentication
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git push --follow-tags origin HEAD:${{ steps.default_branch.outputs.branch }}

      - name: Extract release notes (latest ## section)
        id: notes
        run: |
          chmod +x scripts/extract-release-notes.sh
          scripts/extract-release-notes.sh CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.NEW_VERSION }}     # remove "v" if you set tagPrefix:""
          name: v${{ env.NEW_VERSION }}
          body_path: release_notes.md
          prerelease: ${{ contains(env.NEW_VERSION, '-') }}  # true if you use prerelease tags in future
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack (optional)
        if: ${{ inputs.slack_notify == 'true' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          DEFAULT_BRANCH: ${{ steps.default_branch.outputs.branch }}
        run: |
          chmod +x scripts/post-release-notes-to-slack.sh
          scripts/post-release-notes-to-slack.sh release_notes.md
